views:
  - title: Python-Auswertung
    path: python-auswertung
    icon: mdi:language-python
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Aktueller Lauf
            icon: mdi:play-circle-outline
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.python_processing_prod_processing_last_run_status
                state: Erfolgreich
            card:
              type: tile
              entity: sensor.python_processing_prod_processing_last_run_status
              name: Ergebnis letzter Lauf
              icon: mdi:check-decagram
              color: green
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.python_processing_prod_processing_last_run_status
                state: Erfolgreich mit Warnungen
            card:
              type: tile
              entity: sensor.python_processing_prod_processing_last_run_status
              name: Ergebnis letzter Lauf
              icon: mdi:alert-decagram
              color: orange
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.python_processing_prod_processing_last_run_status
                state: Fehler
            card:
              type: tile
              entity: sensor.python_processing_prod_processing_last_run_status
              name: Ergebnis letzter Lauf
              icon: mdi:close-octagon
              color: red
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.python_processing_prod_processing_last_run_status
                state:
                  - unknown
                  - unavailable
            card:
              type: tile
              entity: sensor.python_processing_prod_processing_last_run_status
              name: Noch kein Ergebnis
              icon: mdi:help-circle-outline
              color: disabled
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.python_processing_prod_processing_run_state
                state: Läuft
            card:
              type: tile
              entity: sensor.python_processing_prod_processing_run_state
              name: Laufzustand
              icon: mdi:run
              color: green
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.python_processing_prod_processing_run_state
                state: Leerlauf
            card:
              type: tile
              entity: sensor.python_processing_prod_processing_run_state
              name: Laufzustand
              icon: mdi:pause-circle-outline
              color: disabled
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.python_processing_prod_processing_run_state
                state:
                  - unknown
                  - unavailable
            card:
              type: tile
              entity: sensor.python_processing_prod_processing_run_state
              name: Noch kein Laufstatus
              icon: mdi:help-circle-outline
              color: disabled

      - type: grid
        cards:
          - type: heading
            heading: Letzter erfolgreicher Lauf
            icon: mdi:clock-check-outline
          - type: tile
            entity: sensor.python_processing_prod_processing_last_success
            name: Zeitpunkt
            icon: mdi:calendar-clock
          - type: tile
            entity: sensor.python_processing_prod_processing_last_runtime
            name: Laufzeit
            icon: mdi:timer-outline
          - type: tile
            entity: sensor.python_processing_prod_processing_last_processed_date
            name: Letzter Verarbeitungstag
            icon: mdi:calendar-check

      - type: grid
        cards:
          - type: heading
            heading: Laufverlauf
            icon: mdi:history
          - type: logbook
            title: Letzte Laufereignisse
            hours_to_show: 168
            name_detail: entity
            target:
              entity_id:
                - sensor.python_processing_prod_processing_last_run_status
                - sensor.python_processing_prod_processing_run_state

      - type: grid
        cards:
          - type: heading
            heading: Diagnose letzter Lauf
            icon: mdi:alert-decagram-outline
          - type: markdown
            content: >-
              {% set diagnostic = states('sensor.python_processing_prod_processing_last_run_diagnostic') %}
              {% if diagnostic in ['unknown', 'unavailable', ''] %}
                Noch keine Diagnose für einen abgeschlossenen Lauf vorhanden.
              {% else %}
                {{ diagnostic }}
              {% endif %}
