views:
  - title: Python-Auswertung
    path: python-auswertung
    icon: mdi:language-python
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Aktueller Lauf
            icon: mdi:play-circle-outline
          - type: tile
            entity: sensor.python_processing_prod_processing_last_run_status
            name: Ergebnis letzter Lauf
            icon: mdi:check-decagram
          - type: tile
            entity: sensor.python_processing_prod_processing_run_state
            name: Laufzustand
            icon: mdi:run

      - type: grid
        cards:
          - type: heading
            heading: Letzter erfolgreicher Lauf
            icon: mdi:clock-check-outline
          - type: tile
            entity: sensor.python_processing_prod_processing_last_success
            name: Zeitpunkt
            icon: mdi:calendar-clock
          - type: tile
            entity: sensor.python_processing_prod_processing_last_runtime
            name: Laufzeit
            icon: mdi:timer-outline
          - type: tile
            entity: sensor.python_processing_prod_processing_last_processed_date
            name: Letzter Verarbeitungstag
            icon: mdi:calendar-check

      - type: grid
        cards:
          - type: heading
            heading: Laufverlauf
            icon: mdi:history
          - type: history-graph
            title: Laufstatus
            hours_to_show: 168
            show_names: true
            entities:
              - entity: sensor.python_processing_prod_processing_last_run_status
                name: Ergebnis
              - entity: sensor.python_processing_prod_processing_run_state
                name: Laufzustand

      - type: grid
        cards:
          - type: heading
            heading: Diagnose letzter Lauf
            icon: mdi:alert-decagram-outline
          - type: markdown
            content: >-
              {{ states('sensor.python_processing_prod_processing_last_run_diagnostic') }}
