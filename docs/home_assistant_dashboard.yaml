views:
  - title: Python-Auswertung
    path: python-auswertung
    icon: mdi:language-python
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Aktueller Lauf
            icon: mdi:play-circle-outline
          - type: tile
            entity: binary_sensor.python_processing_prod_processing_running
            name: Lauf aktiv
            icon: mdi:run
          - type: tile
            entity: sensor.python_processing_prod_processing_last_run_status
            name: Letzter Laufstatus
            icon: mdi:check-decagram
          - type: tile
            entity: binary_sensor.python_processing_prod_processing_failure_latched
            name: Fehler gespeichert
            icon: mdi:alert-circle

      - type: grid
        cards:
          - type: heading
            heading: Letzter erfolgreicher Lauf
            icon: mdi:clock-check-outline
          - type: tile
            entity: sensor.python_processing_prod_processing_last_success
            name: Zeitpunkt
            icon: mdi:calendar-clock
          - type: tile
            entity: sensor.python_processing_prod_processing_last_runtime
            name: Laufzeit
            icon: mdi:timer-outline
          - type: tile
            entity: sensor.python_processing_prod_processing_last_processed_date
            name: Letzter Verarbeitungstag
            icon: mdi:calendar-check

      - type: grid
        cards:
          - type: heading
            heading: Laufverlauf
            icon: mdi:history
          - type: history-graph
            title: Laufstatus
            hours_to_show: 168
            show_names: true
            entities:
              - entity: sensor.python_processing_prod_processing_last_run_status
                name: Status
              - entity: binary_sensor.python_processing_prod_processing_running
                name: Aktiv
              - entity: binary_sensor.python_processing_prod_processing_failure_latched
                name: Fehler gespeichert

      - type: grid
        cards:
          - type: heading
            heading: Diagnose
            icon: mdi:clipboard-pulse-outline
          - type: markdown
            content: >-
              Die Detailinformationen des letzten Laufs stehen als Attribute am
              Sensor "Letzter Laufstatus" zur Verfügung: Warnungsanzahl,
              betroffene Komponenten, Laufzeit und verarbeitete Tage.
